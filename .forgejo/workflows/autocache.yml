name: regenerate Manifest + md5-cache

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.ebuild'
      - '**/*.eclass'
      - '**/metadata.xml'
      - 'profiles/**'
      - 'metadata/layout.conf'
  workflow_dispatch: {}

jobs:
  regen:
    runs-on: codeberg-small-lazy
    container:
      image: codeberg.org/slashpotato/overlay-builder:latest
      options: --network=host

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: repos.conf
        run: |
          set -euo pipefail
          mkdir -p /etc/portage/repos.conf
          cat > /etc/portage/repos.conf/self.conf <<EOF
          [slashpotato]
          location = $(pwd)
          masters = gentoo
          auto-sync = no
          EOF

      - name: regenerate Manifests
        run: |
          set -euo pipefail
          find . -name '*.ebuild' -print0 \
            | while IFS= read -r -d '' f; do
                echo "manifest: ${f}"
                ebuild "${f}" manifest --force
              done

      - name: regenerate md5-cache
        run: egencache --repo=slashpotato --update --jobs="$(nproc)"

      - name: pkgcheck scan
        run: pkgcheck scan --net || true

      - name: commit + push
        env:
          GIT_AUTHOR_NAME: slashbot
          GIT_AUTHOR_EMAIL: slashpotato@duck.com
          GIT_COMMITTER_NAME: slashbot
          GIT_COMMITTER_EMAIL: slashpotato@duck.com
        run: |
          set -euo pipefail
          git add -A -- '**/Manifest' 'metadata/md5-cache'
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "[ci] regenerate Manifest + md5-cache [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
